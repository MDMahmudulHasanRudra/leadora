name: leadora

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:-leadora}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-leadora}
  VALKEY_URL: redis://valkey:6379
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY in .env}
  SMTP_URL: ${SMTP_URL:-}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  APP_ORIGINS: ${APP_ORIGINS:-http://localhost:8080}
  ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_LOCAL_DIR: /data/uploads
  STORAGE_BUCKET: ${STORAGE_BUCKET:-}
  STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
  STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-false}
  KB_MAX_FILE_MB: ${KB_MAX_FILE_MB:-20}
  ENABLE_AI: ${ENABLE_AI:-false}
  ENABLE_KNOWLEDGE_BASE: ${ENABLE_KNOWLEDGE_BASE:-false}
  ENABLE_AUTOMATION: ${ENABLE_AUTOMATION:-false}
  ENABLE_WHATSAPP: ${ENABLE_WHATSAPP:-false}
  ENABLE_EMAIL: ${ENABLE_EMAIL:-false}
  ENABLE_ADVANCED_ANALYTICS: ${ENABLE_ADVANCED_ANALYTICS:-false}
  ENABLE_AI_AUTO_REPLY: ${ENABLE_AI_AUTO_REPLY:-false}

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-leadora}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ., target: api }
    image: leadora/api:local
    command: ["node", "node_modules/@leadora/database/dist/migrate.js"]
    environment: *app-env
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: leadora/api:local
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: 3001
    volumes:
      # Uploads live outside the container filesystem (spec §55); shared with the worker.
      - uploads:/data/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }

  worker:
    build: { context: ., target: worker }
    image: leadora/worker:local
    restart: unless-stopped
    environment: *app-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }

  web:
    build: { context: ., target: web }
    image: leadora/web:local
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3001
    depends_on:
      api: { condition: service_healthy }

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${PUBLIC_HTTP_PORT:-8080}:80"
    volumes:
      - ./infrastructure/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }

volumes:
  pgdata:
  uploads:
  valkeydata:
  caddydata:
  caddyconfig:
