# Exposes Postgres and Valkey on localhost so apps can run on the host with `pnpm dev`.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres valkey
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  valkey:
    ports:
      - "127.0.0.1:6379:6379"
  # Local SMTP sink: every outbound email lands here. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
